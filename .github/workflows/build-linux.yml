
name: Build Redaktilo Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Installa Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth

      - name: Esegui compilazione Linux
        run: |
          chmod +x konstrui_exe.sh
          ./konstrui_exe.sh

      - name: Verifica presenza eseguibile
        run: |
          test -x dist/Redaktilo/Redaktilo
          echo "Eseguibile Linux trovato."

      - name: Test automatico avvio Redaktilo
        run: |
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s \
            ./dist/Redaktilo/Redaktilo
          RESULT=$?
          set -e

          if [ "$RESULT" -eq 0 ] || [ "$RESULT" -eq 124 ]; then
            echo "TEST SUPERATO: Redaktilo si è avviato."
          else
            echo "TEST FALLITO: errore durante l'avvio (codice $RESULT)."
            exit 1
          fi

      - name: Crea archivio Linux
        run: |
          tar -czf Redaktilo-2.32-Linux.tar.gz -C dist Redaktilo

      - name: Pubblica pacchetto
        uses: actions/upload-artifact@v6
        with:
          name: Redaktilo-2.32-Linux
          path: Redaktilo-2.32-Linux.tar.gz
          if-no-files-found: error
