
name: Redaktilo - Python Code Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Analyze Python code
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff vulture deptry

      - name: Check Python files
        id: python-files
        run: |
          if find . -name "*.py" -not -path "./.git/*" | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Python files found."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Python files found."
          fi

      - name: Check unused imports and variables
        if: steps.python-files.outputs.found == 'true'
        run: ruff check . --select F401,F841

      - name: Detect potentially unused code
        if: steps.python-files.outputs.found == 'true'
        continue-on-error: true
        run: vulture . --min-confidence 80 | tee vulture-report.txt

      - name: Check unused dependencies
        if: steps.python-files.outputs.found == 'true' && hashFiles('pyproject.toml') != ''
        continue-on-error: true
        run: deptry .

      - name: Save analysis report
        if: always() && steps.python-files.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: redaktilo-python-audit
          path: vulture-report.txt
          if-no-files-found: ignore
          retention-days: 14
