
name: Redaktilo - Python Code Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Analyze Python code
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff vulture deptry

      - name: Check Python files
        run: |
          if find . -name "*.py" -not -path "./.git/*" | grep -q .; then
            echo "Python files found."
          else
            echo "No Python files found."
            exit 0
          fi

      - name: Check unused imports and variables
        run: ruff check . --select F401,F841

      - name: Detect potentially unused code
        continue-on-error: true
        run: |
          vulture . --min-confidence 80 | tee vulture-report.txt

      - name: Check unused dependencies
        if: hashFiles('pyproject.toml') != ''
        continue-on-error: true
        run: deptry .

      - name: Save analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redaktilo-python-audit
          path: vulture-report.txt
          if-no-files-found: ignore
          retention-days: 14
