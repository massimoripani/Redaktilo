
name: Build Redaktilo v.3

on:
  push:
    branches: [main]
    tags: ["v*"]

  pull_request:
    branches: [main]

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della Release da compilare (es. v2.33). Lascia vuoto per una build di sviluppo."
        required: false
        type: string

permissions:
  contents: read

# Evita esecuzioni contemporanee per la stessa Release.
concurrency:
  group: redaktilo-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:

  # --------------------------------------------------
  # GENERAZIONE WHATS_NEW.TXT
  # --------------------------------------------------

  release-notes:
    name: Genera le note di rilascio

    if: >-
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v')) ||
      (github.ref_type == 'tag' &&
       startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' &&
       startsWith(inputs.tag, 'v'))

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

    steps:
      - name: Genera WHATS_NEW.txt dalle Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" != v* ]]; then
            echo "Tag Release non valido: $RELEASE_TAG"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"

          # Prima prova a recuperare le note già presenti
          # nella Release pubblicata tramite l'interfaccia GitHub.
          BODY=""

          if BODY=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.body // ""' 2>/dev/null); then
            :
          fi

          # Se la Release non esiste ancora o non contiene note,
          # genera automaticamente le note di rilascio.
          if [[ -z "$BODY" ]]; then
            BODY=$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              --jq '.body')
          fi

          {
            printf '# Redaktilo %s\n\n' "$VERSION"
            printf '%s\n' "$BODY"
          } > WHATS_NEW.txt

          echo "Note generate per Redaktilo $VERSION"
          cat WHATS_NEW.txt

      - name: Carica le note
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: WHATS_NEW.txt
          if-no-files-found: error

  # --------------------------------------------------
  # COMPILAZIONE WINDOWS / LINUX / MACOS
  # --------------------------------------------------

  build:
    name: Build (${{ matrix.name }})

    needs: release-notes

    if: >-
      !cancelled() &&
      (needs.release-notes.result == 'success' ||
       needs.release-notes.result == 'skipped')

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            name: windows

          - os: ubuntu-latest
            name: linux

          - os: macos-latest
            name: macos

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

    steps:

      - name: Checkout del codice
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Determina la versione
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" == v* ]]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Versione del pacchetto: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dipendenze di sistema Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      # ----------------------------------------------
      # SCARICAMENTO WHATS_NEW.TXT
      # ----------------------------------------------

      - name: Scarica le note di rilascio
        if: needs.release-notes.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: .

      - name: Prepara WHATS_NEW.txt
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f WHATS_NEW.txt ]]; then
            printf '# Redaktilo %s\n\nBuild di sviluppo.\n' \
              "$VERSION" > WHATS_NEW.txt
          fi

          mkdir -p dist/Redaktilo

          cp WHATS_NEW.txt dist/Redaktilo/WHATS_NEW.txt

      # ----------------------------------------------
      # BUILD WINDOWS
      # ----------------------------------------------

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call konstrui_exe.bat < nul

      # ----------------------------------------------
      # BUILD LINUX / MACOS
      # ----------------------------------------------

      - name: Build Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: sh konstrui_exe.sh

      # ----------------------------------------------
      # WHATS_NEW DENTRO IL PROGRAMMA
      # ----------------------------------------------

      - name: Inserisce WHATS_NEW.txt nel pacchetto
        shell: bash
        run: |
          set -euo pipefail
          cp WHATS_NEW.txt dist/Redaktilo/WHATS_NEW.txt

      # ----------------------------------------------
      # ARCHIVIO WINDOWS
      # ----------------------------------------------

      - name: Comprimi Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/Redaktilo `
            -DestinationPath "Redaktilo-$env:VERSION-windows.zip" `
            -Force

      # ----------------------------------------------
      # ARCHIVI LINUX / MACOS
      # ----------------------------------------------

      - name: Comprimi Linux/macOS
        if: matrix.name != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          tar -czf "Redaktilo-${VERSION}-${{ matrix.name }}.tar.gz" \
            -C dist Redaktilo

      # ----------------------------------------------
      # CARICAMENTO ARTEFATTI
      # ----------------------------------------------

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.name }}
          path: Redaktilo-*.${{ matrix.name == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  # --------------------------------------------------
  # PUBBLICAZIONE / AGGIORNAMENTO RELEASE
  # --------------------------------------------------

  release:
    name: Pubblica i pacchetti

    needs: [build, release-notes]

    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.release-notes.result == 'success' &&
      (
        (github.event_name == 'release' &&
         startsWith(github.event.release.tag_name, 'v')) ||
        (github.ref_type == 'tag' &&
         startsWith(github.ref_name, 'v')) ||
        (github.event_name == 'workflow_dispatch' &&
         startsWith(inputs.tag, 'v'))
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

    steps:

      - name: Scarica gli artefatti di compilazione
        uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: release-assets
          merge-multiple: true

      - name: Scarica WHATS_NEW.txt
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-assets

      # ----------------------------------------------
      # VERIFICA NOMI E PRESENZA DEI PACCHETTI
      # ----------------------------------------------

      - name: Verifica i pacchetti
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"

          echo "Controllo pacchetti della versione $VERSION"

          ls -lh release-assets/

          test -f "release-assets/Redaktilo-${VERSION}-windows.zip"
          test -f "release-assets/Redaktilo-${VERSION}-linux.tar.gz"
          test -f "release-assets/Redaktilo-${VERSION}-macos.tar.gz"
          test -f "release-assets/WHATS_NEW.txt"

          echo "Tutti e tre i pacchetti sono presenti."

      # ----------------------------------------------
      # CHECKSUM SHA256
      # ----------------------------------------------

      - name: Genera SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail

          cd release-assets

          sha256sum \
            "Redaktilo-${RELEASE_TAG#v}-windows.zip" \
            "Redaktilo-${RELEASE_TAG#v}-linux.tar.gz" \
            "Redaktilo-${RELEASE_TAG#v}-macos.tar.gz" \
            > SHA256SUMS.txt

          echo "Checksum generati:"
          cat SHA256SUMS.txt

      # ----------------------------------------------
      # PUBBLICAZIONE RELEASE
      # ----------------------------------------------

      - name: Aggiorna la Release GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Redaktilo ${{ env.RELEASE_TAG }}
          body_path: release-assets/WHATS_NEW.txt
          files: |
            release-assets/Redaktilo-*.zip
            release-assets/Redaktilo-*.tar.gz
            release-assets/WHATS_NEW.txt
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
