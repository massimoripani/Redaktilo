
name: Python Security Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install security tools
        run: |
          python -m pip install bandit pip-audit semgrep ruff detect-secrets

      - name: Bandit - Python vulnerability scan
        run: |
          bandit -r . -x .venv,venv,tests \
            -ll -ii

      - name: Semgrep - Static security analysis
        run: |
          semgrep scan --config p/python --error .

      - name: Detect exposed secrets
        run: |
          detect-secrets scan --all-files \
            --exclude-files '(^|/)(\.git|\.venv|venv)/'

      - name: Audit Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip-audit
          else
            echo "::warning::No requirements.txt or pyproject.toml found. Dependency audit skipped."
          fi

      - name: Ruff - Code quality and security checks
        run: |
          ruff check . --select S

