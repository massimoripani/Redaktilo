
name: Redaktilo - Python Code Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Analyze Python code
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff vulture deptry

      - name: Check Python files
        id: python-files
        run: |
          find . -name "*.py" -not -path "./.git/*" | sort > python-files.txt

          echo "Python files found:"
          cat python-files.txt

          COUNT=$(wc -l < python-files.txt | tr -d ' ')

          echo ""
          echo "Total Python files: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Python files found."
          fi

      - name: Check unused imports and variables
        if: steps.python-files.outputs.found == 'true'
        run: |
          ruff check . --select F401,F841

      - name: Detect potentially unused code
        if: steps.python-files.outputs.found == 'true'
        continue-on-error: true
        run: |
          echo "Starting Vulture analysis..."
          vulture . --min-confidence 60 | tee vulture-report.txt
          echo "Vulture analysis completed."

      - name: Check unused dependencies
        if: steps.python-files.outputs.found == 'true' && hashFiles('pyproject.toml') != ''
        continue-on-error: true
        run: |
          deptry .

      - name: Save analysis report
        if: always() && steps.python-files.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: redaktilo-python-audit
          path: |
            vulture-report.txt
            python-files.txt
          if-no-files-found: ignore
          retention-days: 14
